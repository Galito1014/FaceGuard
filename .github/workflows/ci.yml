# Pruebas automáticas en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Núcleo · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-24.04-arm, python: "3.11" }   # ARM64, como la Raspberry Pi 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: backend/models
          key: models-yunet2023mar-sface2021dec
      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Modelos (con verificación SHA-256)
        working-directory: backend
        run: python -m scripts.download_models
      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Panel web (TypeScript + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  scripts:
    name: Scripts de instalación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis y ShellCheck
        run: |
          for f in deploy/install.sh installers/raspberry-pi/*.sh installers/linux/*.sh backend/scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck -S warning deploy/install.sh installers/raspberry-pi/*.sh installers/linux/*.sh

  secrets:
    name: Sin secretos ni datos personales
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # Gitleaks lee la lista de commits del PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archivos prohibidos en el repositorio
        run: |
          bad=$(git ls-files | grep -Ei '\.(db|db-wal|db-shm|sqlite|onnx|pem|key)$|(^|/)\.env$|fernet\.key|initial_admin\.txt|setup_code\.txt|backend/data/' || true)
          if [ -n "$bad" ]; then echo "Archivos que no deben subirse:"; echo "$bad"; exit 1; fi
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
